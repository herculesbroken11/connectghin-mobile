name: connectghin_flutter
description: ConnectGHIN mobile app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  socket_io_client: ^3.1.4
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^12.0.2
  webview_flutter: ^4.13.1
  geolocator: ^14.0.2
  in_app_purchase: ^3.2.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/connectghin_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/connectghin_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/connectghin_logo.png
